# Edu Manager — tizim nginx'i uchun sayt (serverda boshqa saytlar bilan birga ishlaydi).
# O'rnatish: docs/DEPLOY.md, «Serverda nginx allaqachon bor» bo'limi.
# HTTPS qatorlarini `certbot --nginx -d edu.it-services.uz` o'zi qo'shadi.

# Nomlar boshqa saytlar konfiguratsiyasi bilan to'qnashmasligi uchun "edu_" prefiksi.
limit_req_zone  $binary_remote_addr zone=edu_general:20m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=edu_auth:10m    rate=10r/m;
limit_conn_zone $binary_remote_addr zone=edu_perip:10m;

upstream edu_django {
    server 127.0.0.1:8001;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name edu.it-services.uz;

    client_max_body_size 5m;
    client_body_timeout  10s;
    client_header_timeout 10s;
    limit_req_status  429;
    limit_conn_status 429;
    limit_conn edu_perip 30;

    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }

    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* \.(env|git|sql|bak|py|pyc|log|ini|sh)$ { deny all; return 404; }

    location /media/ {
        alias /opt/edu/media/;
        add_header X-Content-Type-Options nosniff;
        location ~* \.(html?|svg|js|php)$ { add_header Content-Disposition attachment; }
    }

    location ~ ^/login/ {
        limit_req zone=edu_auth burst=5 nodelay;
        proxy_pass http://edu_django;
        include /etc/nginx/snippets/edu-proxy.conf;
    }

    location / {
        limit_req zone=edu_general burst=40 nodelay;
        proxy_pass http://edu_django;
        include /etc/nginx/snippets/edu-proxy.conf;
    }
}
