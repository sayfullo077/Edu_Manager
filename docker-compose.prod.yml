# Production: nginx → gunicorn (Django) → PostgreSQL + Redis. Faqat nginx tashqariga ochiq.
# To'liq yo'riqnoma: docs/DEPLOY.md
#   sh deploy/make-env.sh                     # .env.prod (tasodifiy maxfiy kalitlar bilan)
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

x-app-env: &app-env
  DATABASE_URL: postgres://edu:${POSTGRES_PASSWORD}@db:5432/edu_manager
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  TRUSTED_PROXY_COUNT: "1"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu_manager
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu_manager"]
      interval: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD kerak}",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    restart: unless-stopped

  web:
    build: .
    image: edu-manager:latest
    env_file: .env.prod
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "1"   # har ishga tushishda migrate (deploy/entrypoint.sh)
    volumes: [media:/app/media, private_media:/app/private_media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 1g}

  bot:
    image: edu-manager:latest
    command: ["python", "manage.py", "run_telegram_bot"]
    env_file: .env.prod
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "0"
    depends_on: [web]
    networks: [backend]
    restart: unless-stopped
    profiles: [bot]   # webhook ishlatilsa kerak emas

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-_}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$"   # faqat ${DOMAIN} almashtiriladi ($host va h.k. tegilmaydi)
    volumes:
      # NGINX_MODE=http — IP bilan sinov / sertifikat olish; https — domen + Let's Encrypt
      - ./deploy/nginx/${NGINX_MODE:-http}:/etc/nginx/templates:ro
      - ./deploy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - media:/app/media:ro
      - certbot-www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    depends_on: [web]
    networks: [backend]
    restart: unless-stopped

  # Sertifikat olish/yangilash (bir martalik): docs/DEPLOY.md, 4-qadam
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    profiles: [certbot]

volumes:
  pgdata:
  media:
  private_media:
  certbot-www:
  letsencrypt:

networks:
  backend:
