# Production: nginx → gunicorn (Django) → PostgreSQL + Redis. Faqat nginx tashqariga ochiq.
# Ishga tushirish: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: edu_manager
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD kerak}
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [backend]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edu -d edu_manager"]
      interval: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD kerak}",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [backend]
    restart: unless-stopped

  web:
    build: .
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://edu:${POSTGRES_PASSWORD}@db:5432/edu_manager
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      TRUSTED_PROXY_COUNT: "1"
    volumes: [media:/app/media]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    networks: [backend]
    restart: unless-stopped
    deploy:
      resources:
        limits: {memory: 1g}

  bot:
    build: .
    command: ["uv", "run", "--no-sync", "python", "manage.py", "run_telegram_bot"]
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://edu:${POSTGRES_PASSWORD}@db:5432/edu_manager
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on: [db, redis]
    networks: [backend]
    restart: unless-stopped
    profiles: [bot]   # webhook ishlatilsa kerak emas

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - media:/app/media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [web]
    networks: [backend]
    restart: unless-stopped

volumes:
  pgdata:
  media:

networks:
  backend:
